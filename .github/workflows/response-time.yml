# Based on upptime/upptime (uptime-monitor v1.44.1).
# response-time also creates/closes incidents; it needs the monitoring guard.
name: Response Time CI
on:
  schedule:
    - cron: "13 23 * * *"
  repository_dispatch:
    types: [response_time]
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.repository }}-${{ github.ref_name }}-upptime
  cancel-in-progress: false
jobs:
  release:
    name: Check status
    if: github.ref == 'refs/heads/master' && vars.UPPTIME_MONITORING_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: master
          token: ${{ github.token }}
      - name: Update response time
        uses: upptime/uptime-monitor@v1.44.1
        with:
          command: response-time
        env:
          GH_PAT: ${{ github.token }}
          SECRETS_CONTEXT: '{}'
