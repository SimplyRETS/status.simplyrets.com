# Based on upptime/upptime (uptime-monitor v1.44.1).
name: Graphs CI
on:
  schedule:
    - cron: "0 0 * * *"
  repository_dispatch:
    types: [graphs]
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.repository }}-${{ github.ref_name }}-upptime
  cancel-in-progress: false
jobs:
  release:
    name: Generate graphs
    if: github.ref == 'refs/heads/master' && vars.UPPTIME_MONITORING_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: master
          token: ${{ github.token }}
      - name: Setup Node.js for graphs
        uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Generate graphs
        uses: upptime/uptime-monitor@v1.44.1
        with:
          command: graphs
        env:
          GH_PAT: ${{ github.token }}
