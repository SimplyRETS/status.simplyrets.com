# Based on upptime/upptime (uptime-monitor v1.44.1).
# Keep the branch/activation guards when updating; do not regenerate workflows.
name: Uptime CI
on:
  schedule:
    - cron: "*/5 * * * *"
  repository_dispatch:
    types: [uptime]
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.repository }}-${{ github.ref_name }}-upptime
  cancel-in-progress: false
jobs:
  release:
    name: Check status
    if: github.ref == 'refs/heads/master' && vars.UPPTIME_MONITORING_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: master
          token: ${{ github.token }}
      - name: Check endpoint status
        uses: upptime/uptime-monitor@v1.44.1
        with:
          command: update
        env:
          GH_PAT: ${{ github.token }}
          SECRETS_CONTEXT: '{}'
